name: "\U0001F4DC 架构决策（ADR）"
description: 记录架构或设计决策
labels: ["do:triage"]
title: "decision(scope): "
body:
  - type: input
    id: scope
    attributes:
      label: 决策范围
      description: 关联的 PolicyBase 分卷（如 PB04）
      placeholder: PolicyBase_NN
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 为什么需要这个决策、面临什么问题
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 决策内容
      description: 决定了什么、备选方案是什么、为什么选这个
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: 验收标准（AC）
      description: 决策落地后应满足的可执行验收命令
    validations:
      required: true