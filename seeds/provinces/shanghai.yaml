gazette:
  url: https://www.shanghai.gov.cn/nw2404/index.html
  path_keyword: nw2404
  verified_at: 2026-07-22
  status: ok
  note: |
    上海市人民政府公报。按年份 + 期号浏览（2001 至今）。每期收录市政府文件、
    部门规范性文件、人事任免等。2026 年已确认至第 13 期。

notes: |
  - 上海将"政府信息公开"五子栏目集中整合在 /nw2319/ + /nw49254/ 两级页面，
    没有按全国通行模板做"指南/制度/主动公开"独立 URL。
  - 独立子域 xxgk.sh.gov.cn 承担"依申请公开"统一受理；service.shanghai.gov.cn
    承担"行政规范性文件数据库"。
  - 上海城市法规全书（law.sfj.sh.gov.cn）和统一政策发布平台（zcyc.sh.gov.cn，
    URL 待验证）两个二级平台是特色资源，建议另立采集通道。
  - 三个最关键 URL：
    1) https://www.shanghai.gov.cn/nw2319/index.html （信息公开枢纽）
    2) https://www.shanghai.gov.cn/nw49254/index.html （指南/制度/主动公开合一）
    3) https://xxgk.sh.gov.cn/zwgk_interface/pages/zwgkfront/publicApplyDefault.html （依申请公开）

