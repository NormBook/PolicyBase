        政府各类公示公告，是政府信息公开年报中"主动公开 652 件（2023）"的
        主要载体之一。
    annual_government_website_report:
      url: https://www.xizang.gov.cn/xwzx_406/ztzl_416/cxzt/ndbb/qjdw/
      path_keyword: /xwzx_406/ztzl_416/cxzt/ndbb/
      status: ok
      note: |
        政府网站年度报表（xwzx_406/ztzl_416/cxzt/ndbb/）。位于"新闻资讯"
        子树下，发布自治区政府网站监管 / 季度年度报表材料，与"政府信息公开
        年报"并列于政务公开枢纽页。

# 政府公报
gazette:
  url: https://www.xizang.gov.cn/zwgk/zfgb/
  path_keyword: /zwgk/zfgb/
  verified_at: 2026-07-22
  status: ok
  note: |
    西藏自治区人民政府公报（zwgk/zfgb/）。《政府公报》是自治区人民政府
    规章标准文本的法定载体，与正式文件具有同等效力。办公厅 2024 年报披露
    全年编辑《政府公报》12 期。

notes: |
  - 西藏自治区政府门户 URL 主域为 www.xizang.gov.cn（短域 xizang.gov.cn 也跳
    转至主域），WAF 对 User-Agent 严格的 WebFetch/爬虫拦截较重（报"不合法的参
    数"），但对 curl + Mozilla UA 的访问返回 HTTP 200；多个根级路径（如
    /zwgk/xxgk_424/ysqgk/、/zwgk/zfxxgk/fdzdgknr/、/zwgk/zfxxgk/fdzdgknr/qtfdxx/）
    在裸域或 /index.shtml 后缀下返回 000/非标准响应，但 /index.html 后缀或具
    体子专题页面普遍返回 200，故本表采用已验证可访问的具体页面。
  - 西藏的结构与国务院办公厅模板对标：政务公开 zwgk/ 节点下分两大子树——
    "政府信息公开"（xxgk_424，含指南/规定/依申请/年报/目录 5 子栏目）与"法
    定主动公开内容"（zfxxgk/fdzdgknr，下含政策/规章/规范性文件/重点领域等子
    专题）；另设"信息发布"（xxfb/，含政府文件/政策解读/人事信息/公示公告）
    作为政策发布主轴。"政府信息公开"与"法定主动公开内容"在概念上有所
    重叠，前者是《条例》体系下的口径（指南/制度/申请/年报），后者是"主动
    公开"范畴下的内容专题（含规章、规范性文件等）。
  - 政府信息公开体系下未独立设"行政规范性文件库"二级库，规范性文件与政府
    规章同列于"法定主动公开内容 → 政策"（/zc/）子树下，分别为
    /zc/xzgfxwj/ 与 /zc/gz/。第三方法规库（falvdb.com/法律法规数据库）也提
    供西藏自治区地方政府规章查询，可作为补充。
  - 三个最关键 URL：
    1) https://www.xizang.gov.cn/zwgk/xxgk_424/xxgkzn/
       （政府信息公开指南 — 5 子栏目总入口）
    2) https://www.xizang.gov.cn/zwgk/zfxxgk/fdzdgknr/zc/xzgfxwj/
       （行政规范性文件库）
    3) https://www.xizang.gov.cn/zwgk/zfgb/
       （西藏自治区人民政府公报）

