      /xxgknb/2024nb/202503/t20250331_470472.html （自治区人民政府，2025-03-31
      发布）；办公厅 2024 年度报告见
      /xxgknb/2024nb/202501/t20250126_459516.html。

  disclosure_upon_request:
    url: https://www.xizang.gov.cn/zwgk/xxgk_424/ysqgk/
    path_keyword: /zwgk/xxgk_424/ysqgk/
    verified_at: 2026-07-22
    status: ok
    note: |
      依申请公开（xxgk_424/ysqgk）。提供依申请公开说明、申请流程、申请表下
      载（如 /zwgk/xxgk_424/zxxxgk/201902/W020190223660011380979.doc）及受
      理机构联系方式，由自治区人民政府办公厅统一受理并转办。
      备注：根路径返回非标准响应，必须以 /index.html 形式或从政府信息公开指南
      （xxgkzn）的导航进入可达。

# 专题库
libraries:
  policy_library:
    url: https://www.xizang.gov.cn/zwgk/xxfb/zfwj/
    path_keyword: /zwgk/xxfb/zfwj/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府文件库/政策文献库（zwgk/xxfb/zfwj）。位于"信息发布"（zwgk/xxfb/）
      节点下，与公示公告（gsgg_428/）、政策解读（zcjd_435/）、人事信息
      （rsxx_434/）并列。汇集自治区人民政府、自治区政府办公厅印发的政府文件，
      包括国务院文件转发、规划计划、政府文件、政办文件等。配套政策解读专栏：
      /zwgk/xxfb/zcjd_435/。

  regulation_library:
    url: https://www.xizang.gov.cn/zwgk/zfxxgk/fdzdgknr/zc/gz/
    path_keyword: /zwgk/zfxxgk/fdzdgknr/zc/gz/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府规章库（zfxxgk/fdzdgknr/zc/gz）。位于"法定主动公开内容 → 政策"
      子树下，专题名称"政府规章"，汇集自治区人民政府制定的现行有效政府规章
      （藏政令形式）及配套程序规定（如《西藏自治区人民政府规章制定程序规定》/
      /zwgk/zfxxgk/fdzdgknr/zc/gz/202112/t20211229_276898.html）。
      配套第三方法规库：国家法律法规数据库西藏自治区地方政府规章页
      https://falvdb.com/law/codex/levels/6-地方政府规章/provinces/26-西藏自治区。

  normative_library:
    url: https://www.xizang.gov.cn/zwgk/zfxxgk/fdzdgknr/zc/xzgfxwj/
    path_keyword: /zwgk/zfxxgk/fdzdgknr/zc/xzgfxwj/
    verified_at: 2026-07-22
    status: ok
    note: |
      行政规范性文件库（zfxxgk/fdzdgknr/zc/xzgfxwj）。"西藏自治区行政规范性
      文件"专题，与政府规章（/zc/gz/）并列于"法定主动公开内容 → 政策"
      子树下。汇集自治区人民政府、自治区政府办公厅印发的现行有效行政规范性文
      件，包括 2025 年 1 月《关于废止和修改部分行政规范性文件的决定》
      （藏政发〔2025〕2号）等。

  disclosure_library:
    url: https://www.xizang.gov.cn/zwgk/xxgk_424/zxxxgk/
    path_keyword: /zwgk/xxgk_424/zxxxgk/
    verified_at: 2026-07-22
    status: ok
    note: |
      信息公开目录/政务公开专栏（xxgk_424/zxxxgk）。索引式列表，包含 索引号 /
      文号 / 公开时限 / 生成日期 / 内容分类 / 责任部门 字段，按年度汇聚各类主
      动公开文件（如藏财建〔2026〕46 号等）。

