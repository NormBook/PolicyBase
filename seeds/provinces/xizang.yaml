# 政府信息公开总枢纽
disclosure_homepage:
  url: https://www.xizang.gov.cn/zwgk/
  path_keyword: /zwgk/
  verified_at: 2026-07-22
  status: ok
  note: |
    "政务公开"专栏枢纽页（zwgk/）。侧栏导航含 政府信息公开指南（xxgk_424/
    xxgkzn）、法定政府公开内容（zfxxgk/fdzdgknr）、政府信息公开申请
    （xxgk_424/ysqgk）、重点领域信息公开（zdxxlygk/）、政府规章库
    （zfxxgk/fdzdgknr/zc/gz）、行政规范性文件（zfxxgk/fdzdgknr/zc/xzgfxwj）、
    公示公告、信息公开目录、政府公报（zfgb/）等栏目。与国务院办公厅模板对标。

# 子栏目
sub_sections:
  disclosure_guide:
    url: https://www.xizang.gov.cn/zwgk/xxgk_424/xxgkzn/
    path_keyword: /zwgk/xxgk_424/xxgkzn/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府信息公开指南（xxgk_424/xxgkzn）。标志性子页面为
      /zwgk/xxgk_424/xxgkzn/201912/t20191223_126978.html（西藏自治区人民政府
      政府信息公开指南全文，含主动公开时限 20 个工作日、依申请公开方式、公开
      渠道：政府网站 + 公报 + 新闻发布会 + 微信公众号 + 报刊广播电视等）。

  disclosure_regime:
    url: https://www.xizang.gov.cn/zwgk/xxgk_424/xxgkgd/
    path_keyword: /zwgk/xxgk_424/xxgkgd/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府信息公开制度/信息公开规定（xxgk_424/xxgkgd）。汇集国务院、国务院办公
      厅、自治区人民政府、自治区政府办公厅制定的政府信息公开相关法规、规章、
      规范性文件列表，包括《中华人民共和国政府信息公开条例》、《国务院办公厅
      关于施行<条例>若干问题的意见》、《西藏自治区政府信息公开办法》、
      自治区政务公开工作要点等。

  disclosure_proactive_catalog:
    url: https://www.xizang.gov.cn/zwgk/zfxxgk/fdzdgknr/
    path_keyword: /zwgk/zfxxgk/fdzdgknr/
    verified_at: 2026-07-22
    status: ok
    note: |
      法定主动公开内容（zfxxgk/fdzdgknr）。枢纽节点下含若干并列专题：
      政府文件（zfxxgk/fdzdgknr/zc/zfwj/ 入口）、政府工作报告、政府会议、
      建议提案办理、人事信息、行政规范性文件（/zc/xzgfxwj/）、政府规章
      （/zc/gz/）、其他法定信息（/qtfdxx/）、重点领域信息公开
      （/zdxxlygk/）等，目录页可访问但根路径返回非标准响应，需以具体子专题
      入口为准。代表性子页面：/zfxxgk/fdzdgknr/zc/xzgfxwj/index.html
      （行政规范性文件列表）。

      HTML 树形结构（2026-07-22 自动抓取）：

      根路径 https://www.xizang.gov.cn/zwgk/zfxxgk/fdzdgknr/ 返回 200 + meta refresh 0 秒跳转至 /zwgk/zfxxgk/zfxxgkzn_3159/（指南页），即该省用「政府信息公开指南」页承载 fdzdgknr 侧栏导航。指南页左侧栏直接列出 7 个 fdzdgknr 子栏目（class="wugk-link"）：

      1. 履职依据         /zwgk/zfxxgk/fdzdgknr/lzyj/                  （HTTP 200）
      2. 机关简介         /zwgk/zfxxgk/fdzdgknr/jgjj/                  （HTTP 200）
      3. 规划信息         /zwgk/zfxxgk/fdzdgknr/ghxx/                  （HTTP 200）
      4. 统计信息         /zwgk/zfxxgk/fdzdgknr/tjxx_3166/             （HTTP 200）
      5. 行政事业性收费    /zwgk/zfxxgk/fdzdgknr/sfxm/                  （HTTP 200）
      6. 其他法定信息     /zwgk/zfxxgk/fdzdgknr/qtfdxx/                （HTTP 200）
      7. 政策             /zwgk/zfxxgk/fdzdgknr/zc/                    （HTTP 200，重定向至 /zc/）

      「政策」/zc/ 节点再下挂 4 子类：
      - 政府规章：        /zwgk/zfxxgk/fdzdgknr/zc/gz/
      - 行政规范性文件：   /zwgk/zfxxgk/fdzdgknr/zc/xzgfxwj/
      - 政府文件：        /zwgk/zfxxgk/fdzdgknr/zc/zfwj/              （实测 404）
      - 其他文件：        /zwgk/zfxxgk/fdzdgknr/zc/qtwj/             （未在主导航发现）

      统计：7 个一级 fdzdgknr 子栏目 + 2 个二级（zc/gz, zc/xzgfxwj）= 9 个可达 URL；无 chnl/docnum 元数据（西藏模板未采用国办 chnl 编号体系）。

      特色发现：
      - 西藏「法定主动公开内容」颗粒度极粗（7 大类 vs 重庆 14 大类），未拆出「行政许可/处罚强制/预算决算/政府采购/重大项目/应急管理/监督检查/招考录用」等 §20 项
      - 树形节点未挂载 chnl/docnum 元数据；改用 `_NNNN` 后缀（如 `tjxx_3166`）做栏目识别号
      - 根路径用 meta refresh 跳转至指南页（与「指南页左侧栏承载 fdzdgknr 导航」的范式吻合）

  disclosure_annual_report:
