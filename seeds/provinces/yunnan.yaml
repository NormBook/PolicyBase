notes: |
  - 云南省采用"政府信息公开平台"(zfxxgkpt) 架构：指南/制度/法定主动公开/年报为其子栏目，
    政策文件库/规章库/行政规范性文件库均集中在 gkptzcwj 与检索系统中，结构清晰规范。
  - 特色：政策文件库为独立全文检索系统 searchfs/?siteCode=ynzcwjk；依申请公开走独立子域名 ysqgk.yn.gov.cn。
  - 3 个最关键 URL：
    1. 政策文件库 https://www.yn.gov.cn/searchfs/index_826.html?siteCode=ynzcwjk
    2. 行政规范性文件库 https://www.yn.gov.cn/zwgk/zfxxgkpt/gkptzcwj/xzgfxwj/
    3. 规章库 https://www.yn.gov.cn/zwgk/zfxxgkpt/gkptzcwj/gz/

