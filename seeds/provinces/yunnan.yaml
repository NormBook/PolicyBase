  disclosure_proactive_catalog:
    # 法定主动公开内容（栏目根目录）
    url: https://www.yn.gov.cn/zwgk/zfxxgkpt/fdzdgknr/
    path_keyword: fdzdgknr
    verified_at: 2026-07-22
    status: ok
    note: |
      HTML 树形结构（2026-07-22 自动抓取）：
      云南"法定主动公开内容"采用客户端 JS 渲染（curl 默认只能拿首页 shell，
      大量子菜单通过 JS 异步加载；静态 HTML 仅露出部分导航锚点）。

      静态 HTML 可直接观察到的 fdzdgknr 子项：
      1. 省政府领导：     https://www.yn.gov.cn/zwgk/zfxxgkpt/fdzdgknr/zfld/
      2. 省政府机构：     https://www.yn.gov.cn/szf/zfjg/
      3. 省政府会议：     https://www.yn.gov.cn/ywdt/hyxx/szfhy/
      4. 常务会议日历：   https://www.yn.gov.cn/ywdt/hyxx/szfhy/szfcwhy/index_769.html
      5. 政府工作报告：   https://www.yn.gov.cn/zwgk/zfxxgk/zfgzbg/
      6. 政府信息公开平台：https://www.yn.gov.cn/zwgk/zfxxgkpt/zfxxgkzn/
      7. 政策文件：       https://www.yn.gov.cn/zwgk/zcwj/zxwj/
      8. 政策解读：       https://www.yn.gov.cn/zwgk/zcjd/zcjd1/
      9. 省政府公报：     https://www.yn.gov.cn/zwgk/zfgb/index_769.html
      10. 规章库：        https://www.yn.gov.cn/zwgk/zfxxgkpt/gkptzcwj/gz/
      11. 规范性文件库：  https://www.yn.gov.cn/zwgk/zfxxgkpt/gkptzcwj/xzgfxwj/
      12. 云南省政策文件库：https://searchfs/index_826.html?siteCode=ynzcwjk
      13. 省长信箱：      https://xfservice.yn.gov.cn/wsxf/mailbox?type=02

      树根 id：#szfbm（省政府部门）/ #zszf（州市政府）——切换 tab 显示 14 类
      法定主动公开子菜单。

      范式特征：
      - 云南 fdzdgknr 主页面采用客户端 JS 渲染（curl 无法获得完整树形），
        走"zfxxgkpt"目录分支（与江西/吉林的"zfxxgkpt"同源变体）
      - 14 类法定主动公开子菜单通过 #szfbm / #zszf tab 切换加载，
        JS 加载后挂接到二级域名 ynsrmzfw_vx/wap/zfxxgkpt 频道
      - 政策文件库采用第三方全文检索接口 searchfs（siteCode=ynzcwjk），
        是云南"分散检索入口"模式
      - 静态 HTML 仅露出顶层导航（领导/机构/会议/政府工作报告/政策解读/
        公报/规章/规范性文件），其他 14 大类需 JS 异步加载才能完整捕获
