    note: |
      法定主动公开内容（xxgk/xxgk/fd/）。下挂 17 个一级类目 + 5 类主题分类（青政/青政人/青政办/青政办函），采用 chnl/docnum 元数据（id="c_X" 形式）。
      HTML 树形结构（2026-07-22 真实 Chrome 150 抓取）：
      青海用 c_X 频道号模型 + /xxgk/1/[发文字号分类] 二级栏目结构 + 8 个市州全覆盖。
      累计 409 个政策相关 URL（青海最完整）：
      - 政府信息公开首页（106 个）：含省政府规章/行政规范性文件 + 8 个市州（西宁/海南州/海西州/果洛州/黄南州/玉树州/海北州/海东市）法规库入口 + 5 个发文字号栏目（青政/青政人/青政办/青政办函/省政府令）
      - 政府信息公开制度（90 个）：与首页同源但侧栏不同
      - 法定主动公开内容根（93 个）：含 /xxgk/1/2/ 省政府令 + /xxgk/1/4/ 青政 等发文字号分类
      - 规章库（109 个）：/xxgk/xxgk/fd/lzyj/gzk/ + 8 个市州 + c_X 频道号（青海独特）
      - 政府公报（951 个！）：/xxgk/xxgk/qhzb/ 半月刊，覆盖 2017-2026 多年
      范式特征：青海用 c_X 频道号模型 + /xxgk/1/[发文字号分类] 二级栏目结构 + 8 个市州全覆盖。


      HTML 树形结构（2026-07-22 自动抓取）：

      17 个一级 fd 类目（来自 http://www.qinghai.gov.cn/xxgk/xxgk/fd/）：
