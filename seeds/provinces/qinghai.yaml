      - 省政府令       id=c_2  /xxgk/1/2/   docnum=0
      - 青政           id=c_4  /xxgk/1/4/   docnum=0
      - 青政人         id=c_5  /xxgk/1/5/   docnum=0
      - 青政办         id=c_6  /xxgk/1/6/   docnum=0
      - 青政办函       id=c_7  /xxgk/1/7/   docnum=0

      政府信息公开年报（侧栏年度目录）：
      /xxgk/xxgk/zwgkzfxxgknb/n{2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010}/

      统计：17 个 fd 一级类目 + 22 个主题分类（c_9..c_30）+ 5 个文号分类 + 16 年年报 = 60 个可达 URL；所有 fd 类目 docnum=0（需进入类目页后另行计算）。

      特色发现：
      - 青海「法定主动公开内容」颗粒度与重庆最接近（17 类 vs 重庆 14 类）；超出 §20 列举式，新增「权力和责任清单」「议案和提案」「公共资源配置」「放管服清单」4 类
      - 树形节点挂载 chnl 元数据（c_X 形式），但 docnum 全部为 0（不同于重庆的 chnl=120519/docnum=418 形式）
      - 主题分类采用 22 个 c_9..c_30 编号（与国办主题分类 GB/T 21010 对齐），但未在 fd 主树上挂载，而是放在 /xxgk/8/ 政策文件检索路径下
      - 缺省入口是「政府文件」/xxgk/xxgk/fd/zfwj/，与 fdzdgknr 同义
