notes: |
  - 山东省政府门户采用统一"政府信息公开"专栏（col159182），5 个子栏目均在 col15xxxx / col305xxx 体系下，并挂 vc_xxgkarea 组织区代码 113700000045022274。依申请公开使用独立子路径 /ysqgk/，未在 col159182 体系内。
  - 政策文件库（col320658）实为"省政府及省政府办公厅文件"专题，含 省政府令/鲁政发/鲁政办发/鲁政字 等多文档号类目，部门规范性文件另由 col107862 承载。
  - 规章库（col266672）收录省政府令；行政规范性文件由 col314852"规范性文件公开管理平台"统一管理（已收录 1798 件、有效 967 件）。
  - 政府公报使用门户内 col100618 频道（http 接口 jpaas-jpolicy-web-server/front/gongbao 仅 405，需走 HTML 频道），未见独立子域名。
  - 三个最关键 URL：主站 http://www.shandong.gov.cn/、信息公开专栏 http://www.shandong.gov.cn/col/col159182/index.html?vc_xxgkarea=113700000045022274&jh=261、规范性文件公开管理平台 http://www.shandong.gov.cn/col/col314852/index.html
