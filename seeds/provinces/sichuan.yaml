      范式特征：
      - 四川采用自定义 Sichuan-CMS 范式（侧栏 anchor + c10xxxx 节点 ID），
        不走 chnl/docnum 频道号模型（与重庆 chnl=120519 差异显著）
      - 颗粒度比重庆细（21 个一级类目 vs 重庆 14 类 36 URL），
        特色是新增「部门规范性文件/其他文件/重点领域/五公开/建议提案/
        政府工作报告/法治政府建设报告」七个四川特有类目
      - 多个子项外链到 czt.sc.gov.cn / ccgp-sichuan.gov.cn 等厅局子站，
        是四川"分散维护"模式
      - 节点 ID 数字连续（c102917 机关简介 → c102914 规范性文件 → c102930 统计 →
        c102934 行政许可 → c102941 重大项目 → c102945 重大民生 → c108547 规划 →
        c108923 规章 → c109479 行政处罚 → c111321 重点领域 → c111324 五公开），
