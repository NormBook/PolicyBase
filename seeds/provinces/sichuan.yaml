notes: |
  - 四川特色：省政府信息公开各子栏目统一挂在门户 10462 节点下，路径命名规范（zfxxgkzn/zfxxgkzd/ysqgk）。
  - 专题库集中在"四川省政策文件库"(scszkwjkn)，规章库/规范性文件库并非独立站点，而是同一检索库
    scszcwjkss 通过 policyType 参数区分（=1 规章，=2 行政规范性文件）。
  - 政府公报为独立子站 /scszfgb/。年报入口随年份变更节点，2025 年报为 2025nb。
  - 3 个最关键 URL：政务公开首页 https://www.sc.gov.cn/10462/index.shtml ；
    政策文件库 https://www.sc.gov.cn/10462/c108704/scszkwjkn.shtml ；
    政府公报 https://www.sc.gov.cn/scszfgb/index.shtml
