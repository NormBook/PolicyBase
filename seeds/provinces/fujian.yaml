notes: |
  - 福建省政府门户网站采用统一的"政务公开（/zwgk/）"一级栏目，二级栏目集中于 /zwgk/zfxxgk/ 下（指南、制度、法定主动公开、年报、依申请公开），结构清晰。
  - 政策文件库为独立子站 /zck/，聚合国家法律法规、国家政策文件、福建省政府文件、各设区市文件四大类（首页曾短暂以 /zcwjk/ 上线，已重定向到 /zck/）。
  - 政府公报使用独立站点 zfgb.fujian.gov.cn，公开历史可追溯至 1997 年至 2026 年（连续近 30 年）。
  - 三个最关键 URL：主站 https://www.fujian.gov.cn/ 、政策文件库 https://www.fujian.gov.cn/zck/ 、政府公报 http://zfgb.fujian.gov.cn/
