    note: |
      法定主动公开内容（2026-07-22 自动抓取）。福建门户采用 Avalon.js
      嵌入式 chnlid 三级树形（childlist + threeLev 双层），12 个大类 +
      多级 URL，与重庆 chnl=120519/docnum=418 树形风格一致。

      HTML 树形结构（从 fj.html JS 段 gknr.childlist 提取）：

      1. 机关职能 (chnlid=40618)
         - 省政府领导 (chnlid=40619)         http://www.fujian.gov.cn/zwgk/zfxxgk/fdzdgknr/jgzn/szfld/
         - 省政府组织机构 (chnlid=40620)     http://www.fujian.gov.cn/zwgk/zfxxgk/fdzdgknr/jgzn/szfzzjg/
      2. 规划计划 (chnlid=40753)              http://www.fujian.gov.cn/zwgk/ghjh/
         - (三级为空)
      3. 统计信息 (chnlid=40802)              http://www.fujian.gov.cn/zwgk/sjfb/
         - (三级为空)
      4. 行政许可 (chnlid=57855)             http://www.fujian.gov.cn/zwgk/zfxxgk/fdzdgknr/xzxk/
         - 2019年 (chnlid=57856)              https://zwfw.fujian.gov.cn/person-todo/detail?userType=3
         - 2018年以前 (chnlid=57857)          http://xy.fujian.gov.cn/#/double-publicity-info
      5. 行政处罚 (chnlid=62658)             https://ythdrhxzzf.fujian.gov.cn/zfgs/#/publicity/start/services
      6. 预算/决算 (chnlid=67104)            https://czt.fujian.gov.cn/ztzl/sjyjsgkpt/sjzfyjsgk/
      7. 收费项目 (chnlid=40762)             https://www.fujian.gov.cn/zwgk/zdlyxxgk/jghsf/xzsyxsf/
      8. 政府采购 (chnlid=40763)             http://zfcg.czt.fujian.gov.cn/
      9. 重大项目 (chnlid=40764)             http://www.fujian.gov.cn/zwgk/ztzl/zdjsxm/
      10. 重大民生信息 (chnlid=40629)         http://www.fujian.gov.cn/zwgk/zfxxgk/fdzdgknr/zdmsxx/
      11. 招考录用 (chnlid=40769)             http://gwykl.fujian.gov.cn
      12. 其他法定信息 (chnlid=40639)         http://www.fujian.gov.cn/zwgk/zfxxgk/fdzdgknr/qtfdxx/
          - 2019年 (chnlid=40774)             http://zfgb.fujian.gov.cn/
          - 2018年以前 (chnlid=40775)         http://www.fujian.gov.cn/szf/gzbg/
          - 2018年以前 (chnlid=40776)         http://www.fujian.gov.cn/szf/szfhy/

      父级 gknr.name="法定主动公开内容" (chnlid=40617)。
      完整 chnlid 范围：40617（父）+ 40618-40620 + 40629 + 40639 + 40753 +
      40762-40764 + 40769 + 40774-40776 + 40802 + 57855-57857 + 62658 + 67104。
      注：未发现 "应急管理" 与 "监督检查" 两个独立大类（合并入"重大民生信息"/
      "其他法定信息"或由 ythdrhxzzf.fujian.gov.cn 第三方系统承载），与重庆 14 大类
      范式相比缺少 2 类。年报独立板块 gknb 由 chnlid=22084 承载，含
      2020-2025 各年度子频道（41700/55061/59168/62598/65243/67890）。

      范式特征：
      - 福建是国内少数几个完整保留 chnlid+threeLev 双层树形的省份（与重庆一致）；
      - 缺 docnum 文档数（HTML 中未发现 docnum 属性），仅 chnlid + URL；
      - 颗粒度：12 大类 vs 重庆 14 大类，差异在"应急管理"和"监督检查"未独立。
