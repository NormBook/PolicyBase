  path_keyword: col84597
  verified_at: 2026-07-22
  status: ok
  note: |
    "政务公开导航"页面，按"政府信息公开/重点领域信息公开/专题公开"三大类
    列出全部公开栏目，包括规章、行政规范性文件、政策文件、政府公报、
    13 个设区市公开入口等，是完整的栏目索引。

