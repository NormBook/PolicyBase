  note: |
    重庆市政府公报范式：按年份目录 + 期号子目录双层结构。
    根路径 `/zwgk/zfxxgkml/zfgb/`（2026 年实测为首页入口）；按年份下钻到 `/zfgb/YYYY/`（2022-2026 全部实测可达）：
    - 2026: https://www.cq.gov.cn/zwgk/zfxxgkml/zfgb/2026/  （已发布 5 期）
    - 2025: https://www.cq.gov.cn/zwgk/zfxxgkml/zfgb/2025/  （全年 24 期）
    - 2024: https://www.cq.gov.cn/zwgk/zfxxgkml/zfgb/2024/  （全年 24 期）
