notes: |
  - **重庆市政府信息公开官网完整栏目清单（2026-07-22 用户二次确认）**：共 8 个主入口
    1. 高级搜索（独立检索入口）
    2. 政策（3 大类：政府规章 / 行政规范性文件 / 其他文件；位于 /zwgk/zfxxgkml/szfwj/）
    3. 政府信息公开指南（/zwgk/zfxxgkzl/zfxxgkzn/）
    4. 政府信息公开制度（/zwgk/zfxxgkzl/zfxxgkzd/）
    5. 法定主动公开内容（/zwgk/zfxxgkzl/fdzdgknr/，14 子类，详见对应字段 note）
    6. 政府信息公开年报（/zwgk/zfxxgkzl/zfxxgknb/）
    7. 政府公报（/zwgk/zfxxgkml/zfgb/YYYY/，5 个年份目录全部 200）
    8. （无独立「依申请公开」栏目，详见 disclosure_upon_request 字段）
  - 重庆采用「市政府门户 + 司法局规章库」双库架构：政策/规范性文件统一在 cq.gov.cn/zwgk/zfxxgkml/szfwj/ 下；政府规章（渝府令）则单独托管于 sfj.cq.gov.cn/xzwjk/page/shizhengfu/guizhangku/，两库分立
  - 「法定主动公开内容」/zwgk/zfxxgkzl/fdzdgknr/ 含 14 个子分类（履职依据/机关简介/规划信息/统计信息/行政许可/行政处罚强制/预算决算/收费项目/政府采购/重大项目/重大民生信息/应急管理/监督检查/招考录用），颗粒度细于其他省
