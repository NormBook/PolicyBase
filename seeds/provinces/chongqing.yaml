  disclosure_upon_request:
    url: null
    path_keyword: null
    verified_at: 2026-07-22
    status: not_found
    note: |
      重庆市政府门户未提供独立的「依申请公开」栏目入口。2026-07-22 用户再次确认：重庆信息公开官网的栏目仅含「高级搜索 + 政策（3 类）+ 政府信息公开指南 + 政府信息公开制度 + 法定主动公开内容（14 子类）+ 政府信息公开年报」共 8 个主入口，**没有独立的依申请公开栏目**。
      检索过程：
      1. 政府信息公开指南页面（/zwgk/zfxxgkzl/zfxxgkzn/szf/202501/t20250106_14051663.html）的「二、依申请公开政府信息」段落仅指向一个相对路径 ./tip.html（在指南页内嵌的「在线申请」表单，无独立栏目 URL）；
      2. 政务公开首页（/zwgk/）未列出「依申请公开」导航；
      3. 制度页（/zwgk/zfxxgkzl/zfxxgkzd/）仅有指南/制度/主动公开/年报四个侧栏链接，无「依申请公开」一栏；
      4. 关键词检索「依申请公开 site:cq.gov.cn」无政府门户直链，仅返回区县/部门子站（如 cqkz.gov.cn、cqnc.gov.cn 等）。
      建议在抓取阶段把依申请公开申请表挂在「市政府办公厅政府信息公开指南（2025年版）」页面下作为子资源；具体受理仍由区县/部门子站分散承担。

