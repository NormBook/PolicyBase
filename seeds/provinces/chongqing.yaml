    - 2022: https://www.cq.gov.cn/zwgk/zfxxgkml/zfgb/2022/  （全年 19-21 期）
    期号子路径模式：`/d1q/` `/d2q_398756/` `/d24q/` 等（带期号 + 随机后缀的目录形式）。
    主管：市政府办公厅；CN 50-1147/D；半月刊。
