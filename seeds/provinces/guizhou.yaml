notes: |
  - 贵州省门户采用统一 /zwgk/ 政务公开 + /zwgk/zfxxgk/ 政府信息公开二级架构；政策文件库独立于 /ztzl/zcwjk/ 专题。
  - 规章与规范性文件拥有两套独立门户：规章库挂在 /zwgk/zfxxgk/zc/ 下可按省/9 市州分库，规范性文件库与备案审查归口 /ztzl/gzsgzhgfxwjsjk/；另有人大 gzfg.gzrd.gov.cn 综合库（地方性法规/规章/规范性文件）作为补充入口。
  - 政府公报采用省级栏目 /zwgk/zfgb/gzszfgb/，历史可追溯至 1992 年至 2026 年共 35 年（2026 年第 8 期为最新在编期号）。
  - 三个最关键 URL：主站 https://www.guizhou.gov.cn/ 、政策文件库 https://www.guizhou.gov.cn/ztzl/zcwjk/ 、政府公报 https://www.guizhou.gov.cn/zwgk/zfgb/gzszfgb/
