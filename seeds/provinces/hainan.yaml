# 专题库
libraries:
  policy_library:
    url: https://www.hainan.gov.cn/hainan/zfwj/zcwj_list.shtml
    path_keyword: /hainan/zfwj/
    verified_at: 2026-07-22
    status: ok
    note: |
      "政策文件"列表页（/hainan/zfwj/zcwj_list.shtml）= 政策文献库。
      三大分类：省委有关文件 / 省政府文件 / 省政府办公厅文件，
      含"十五五"生态文明建设规划、消费品以旧换新、灾后重建等近期文件。
      是省政府公开门户中"非规章类政策文件"的主索引。

  regulation_library:
    url: https://www.hainan.gov.cn/hainan/xxyxzfgz/zfgzk.shtml
    path_keyword: /hainan/xxyxzfgz/zfgzk.shtml
    verified_at: 2026-07-22
    status: ok
    note: |
      海南省政府规章库（/hainan/xxyxzfgz/zfgzk.shtml，页头标题"海南省政府规章库"）。
      汇集"全省现行有效规章"，每条附文号、公布日期、DOCX/PDF 下载。
      当前样本含 15 部：废止太阳能热水器管理规定（令 340 号）、12345 政府
      服务热线管理、海南自贸港"零关税"日用消费品管理、公共数据资源开发
      利用、失业保险、城镇饮用水卫生监督、行政规范性文件制定与备案、土地
      储备管理、政府规章备案审查、潜水作业管理、商事调解组织登记管理、
      科学技术奖励、消防安全责任制、地图管理等。
      注：WebFetch 命中页面（主域 SSL 重定向 http 仍可达）。

  normative_library:
    url: https://www.hainan.gov.cn/hainan/flfgxzgfxwj/fgsjk_ywh.shtml
    path_keyword: /hainan/flfgxzgfxwj/
    verified_at: 2026-07-22
    status: ok
    note: |
      行政规范性文件栏目（/hainan/flfgxzgfxwj/fgsjk_ywh.shtml）。
      提供文号 / 制定机关 / 公布日期 / 时效性（尚未生效/有效）/ 主题分类
      五个筛选器，列示 278 条规范性文件（含"十五五"卫生健康规划、
      旅游、教育、育儿补贴、长期护理保险、安居房管理等）。页面首部以司法厅
      备案目录（justice.hainan.gov.cn）作为外部权威链接。

  disclosure_library:
    url: https://www.hainan.gov.cn/hainan/zfxxgk/newxxgk_index.shtml
    path_keyword: /hainan/zfxxgk/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府信息公开专栏 = /hainan/zfxxgk/newxxgk_index.shtml（即
      disclosure_homepage 同址）。承担"政务公开/政府信息公开"统一入口角色，
      包含 9 项主菜单 + 法定主动公开各子项 + 政府公报 + 各部门各市县
      信息公开子站链接。是该省"政务公开专题"总枢纽。

  supplementary_libraries:
