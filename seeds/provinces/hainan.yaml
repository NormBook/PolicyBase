      path_keyword: /zfgbhtml/history.html
      status: ok
      note: |
        政府公报历史档案（1989-2004）。提供历史公报（2003、2002、2001、
        2000、1999、1995 等）链接，可作为旧档批量补采入口。

# 政府公报
gazette:
  url: https://www.hainan.gov.cn/zfgbhtml/zfgb.html
  path_keyword: /zfgbhtml/zfgb.html
  verified_at: 2026-07-22
  status: ok
  note: |
    《海南省人民政府公报》主页面（/zfgbhtml/zfgb.html）。海南省人民政府
    机关刊物，创办于 1989 年，刊登省人大常委会、省政府、省政府办公厅
    制定的法规性、政策性文件，在《公报》上刊发的各类公文与正式文件具有
    同等效力。检索维度：标题 / 正文 / 文件类别 / 文号 / 成文日期。
    历史档案入口 /zfgbhtml/history.html。单期样例：
    /zfgbhtml/detail.html?id=6611 与 /zfgbhtml/detail.html?id=7139。
    提供 PDF 下载与手机扫码阅读入口，并链海口市、三亚市地方公报。

notes: |
  - 海南省政府信息公开采用"政府信息公开" + "政策法规" 双轨命名：根目录
    /hainan/zfxxgk/ 是政府信息公开总枢纽；/hainan/zfwj/ 是政策文献
    主索引（既含"政策文件"统称又含省政府/办公厅子分类）。"规章库"与
    "行政规范性文件库"则各为独立栏目，分别挂接 /hainan/xxyxzfgz/zfgzk.shtml
    和 /hainan/flfgxzgfxwj/fgsjk_ywh.shtml，未设在 zfxxgk 频道下。
  - 该省特色是"政府信息公开制度"独立挂接根域下 /zfxxgkzd/，与 /hainan/
    下大多数栏目平级，下属单篇制度文档则回到 /hainan/xxgk/0200/0202/
    201401/ 路径下，导致新旧两套路径风格共存。
  - 部分子栏目（特别是 2021-2025 年报、规划/招考/应急等法定主动公开子项、
    "机关简介"等）虽在主菜单列出但具体年份/类别链接大量使用
    javascript:void(0)，需经栏目列表分页或鼠标悬停展开访问；本调研只
    列出经实际可达 URL 确认的核心入口，避免编造 null/placeholder。
  - 三个最关键 URL：
    1) https://www.hainan.gov.cn/hainan/zfxxgk/newxxgk_index.shtml
       （政府信息公开总枢纽，覆盖 9 个主菜单）
    2) https://www.hainan.gov.cn/hainan/xxyxzfgz/zfgzk.shtml
       （省政府规章库，含 15 部现行有效规章）
    3) https://www.hainan.gov.cn/zfgbhtml/zfgb.html
       （省政府公报 1989-）

