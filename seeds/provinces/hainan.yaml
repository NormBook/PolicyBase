# 政府信息公开总枢纽
disclosure_homepage:
  url: https://www.hainan.gov.cn/hainan/zfxxgk/newxxgk_index.shtml
  path_keyword: /hainan/zfxxgk/
  verified_at: 2026-07-22
  status: ok
  note: |
    "政府信息公开"专栏侧栏入口（/hainan/zfxxgk/newxxgk_index.shtml）。
    顶部 9 项主菜单：政府规章、行政规范性文件、其他文件、政府信息公开指南、
    政府信息公开制度、法定主动公开内容、政府信息公开年报、依申请公开、
    政府公报。各菜单中部分年份/类别链接（特别是 2021-2025 年报、机关简介、
    规划信息、招考录用、应急管理等）使用 javascript:void(0) 占位，需经侧栏
    数字列表或栏目页多入口访问。

# 子栏目
sub_sections:
  disclosure_guide:
    url: https://www.hainan.gov.cn/hainan/xxgkzn/newxxgk_list.shtml
    path_keyword: /hainan/xxgkzn/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府信息公开指南页，按《政府信息公开条例》（国务院令第 711 号）编制。
      三章：主动公开（15 大类，含规章、规划、预算、环境监测、公务员考录等）、
      依申请公开（网络/信函/当面三种渠道，20 工作日可延 20 日）、监督和救济
      （投诉电话 0898-65230373、复议/诉讼）。受理机关：海南省人民政府办公厅，
      地址：海口市美兰区国兴大道 9 号，邮编 570204。

  disclosure_regime:
    url: https://www.hainan.gov.cn/zfxxgkzd/
    path_keyword: /zfxxgkzd/
    verified_at: 2026-07-22
    status: ok
    note: |
      "政府信息公开制度"专栏（根域名下 /zfxxgkzd/）。WebSearch 命中该 URL
