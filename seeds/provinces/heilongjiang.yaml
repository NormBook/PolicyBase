    verified_at: 2026-07-22
    status: ok
    note: |
      法定主动公开内容（2026-07-22 自动抓取）。黑龙江门户采用"频道号 c108xxx
      组织"模式而非 chnl/docnum 树形。父频道 c108395（中华人民共和国政府信息公开
      条例）通过 meta-refresh 重定向到 /hlj/c108397/zfxxgk.shtml（机关简介）；
      法定主动公开内容下设 22 个频道，按"政府信息公开条例 §20 列举"展开：

      1. 机关简介 (c108397, 父级)
         - 机构设置 (c108396) - 省政府组成部门 (c108400)、省政府机关 (c108398)、
           省政府办公厅 (c108399)、直属特设机构 (c108401)、直属机构 (c108402)、
           部门管理机构 (c108403)
      2. 规划计划 (c108408) — 国民经济和社会发展规划 (c108409)、
         国土空间规划 (c108410)、专项规划 (c108411)、区域规划 (c108412)
      3. 统计信息 (c108418) — 统计公报 (c108419)、统计年鉴 (c108420)、
         统计分析 (c108421)
      4. 财政预决算 (c108417)
      5. 重大建设项目 (c108422) — 批准情况 (c108423)、实施情况 (c108424)
      6. 重大民生信息 (c108425) — 乡村振兴 (c108426)、教育 (c108427)、
         医疗 (c108428)、社会保障 (c108431)、促进就业 (c108432)
      7. 应急管理 (c108413) — 应急预案 (c108414)、应对情况 (c108415)
      8. 监督检查 (c108426 隐含父) — 环境保护 (c108433)、公共卫生 (c108434)、
         安全生产 (c108435)、食品药品 (c108436)、产品质量 (c108439)
      9. 招录信息 (c108405)

      注：c108404 / c108406 / c108407 / c108416 在 HLJ zwgk.shtml 侧栏未链接；
      直访 list.shtml 全部 200 但返回 zwgk.shtml 模板页（body 147917 字节，含
      "我向省长说句话/意见征集/政务访谈"等互动类栏目），疑似已废弃或预留频道号。

      范式特征：HLJ 不使用 chnl/docnum 树形，而是把每个子类建成独立频道号
      c108xxx，每个频道返回独立 ColumnName meta + zfxxgk.shtml 模板；
      与重庆 chnl=120519+docnum=418 的树形结构完全不同。颗粒度近似重庆
      （13 大类 vs 重庆 14 大类），但导航层级比重庆浅 1 层（无三级 URL）。
