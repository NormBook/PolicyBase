notes: |
  - 省门户 www.hlj.gov.cn 由省政府办公厅主办、省政务信息化管理服务中心维护；政务公开以频道号 c108xxx 组织，年报/依申请等以 shtml 静态页承载。
  - 省门户设"规章库"(c108370)与"文件库"(c108371) 两个独立库，但未见"行政规范性文件"专用库；行政规范性文件的权威检索入口是省人大主办的"黑龙江省法规规章规范性文件库" https://fgk.hljrd.gov.cn/h5/ （已作 normative_library）。
  - 3 个最关键 URL：主站 https://www.hlj.gov.cn/ ；政务公开 https://www.hlj.gov.cn/hlj/c108368/zwgk.shtml ；规范性文件库 https://fgk.hljrd.gov.cn/h5/
