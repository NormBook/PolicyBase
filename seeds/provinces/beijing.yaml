notes: |
  - 北京市采用"首都之窗"门户（www.beijing.gov.cn），主站强制 HTTPS；早期 http:// 链接仍可访问但 301 跳转至 https://
  - 政务公开与政府信息公开栏目统一挂载在 /gongkai/ 路径下，区别于其他省常用的 /zwgk/ 或 /xxgk/
  - 5 个子栏目 URL 范式完全遵循 /gongkai/zfxxgk/{zfxxgkzn,zfxxgkzd,fdzdgknr,gknb,ysqgk}/，全部为独立可访问页面
  - 政策/规章/规范性文件三库分别位于 /zhengce/zhengcefagui/、/gongkai/zfxxgk/zc/gz/、/zhengce/gfxwj/，各自独立
  - 政府公报位于 /zhengce/zfgb/（主页面），历史公报通过 /zhengce/zfgb/lsgb/ 和搜索系统 /so/zcdh/zfgbHistory 提供
