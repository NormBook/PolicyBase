    verified_at: 2026-07-22
    status: ok
    note: |
      法定主动公开内容（fdzdgknr）下设 4 个一级类目（2026-07-22 自动抓取）：
      URL: https://www.beijing.gov.cn/gongkai/zfxxgk/fdzdgknr/

      1. 履职依据（lzyj）         - https://www.beijing.gov.cn/gongkai/zfxxgk/fdzdgknr/lzyj/index.html
      2. 机关简介（jgjj）         - https://www.beijing.gov.cn/gongkai/zfxxgk/fdzdgknr/jgjj/index.html
                                  子项：市领导 / 机构职能 / 市级部门及区政府领导 / 北京市政府对外联系电话查询
      3. 重大民生信息（zdmsxx）   - https://www.beijing.gov.cn/gongkai/zfxxgk/fdzdgknr/zdmsxx/index.html
      4. 其他法定信息（qtfdxx）   - https://www.beijing.gov.cn/gongkai/zfxxgk/fdzdgknr/qtfdxx/index.html

      特色发现：
      - 北京「法定主动公开内容」颗粒度极粗（仅 4 类），与重庆 14 类 36 URL 相比是省内最简版本；4 类是首都之窗门户的自定义分组，未严格按《政府信息公开条例》§20 列举式 15 项展开
      - HTML 源码中无 chnl/docnum 字段（非 channelcms 模板），用 URL pinyin 缩写代替（lzyj/jgjj/zdmsxx/qtfdxx）
      - 第 3 类「重大民生信息」与重庆同名，承载教育、医疗、社保等 17 个子栏目；其他三类颗粒度很细（机关简介子页含市领导、机构职能、联系方式）
