notes: |
  - 江西省政府门户网站域名 jiangxi.gov.cn，省级"政务公开"统一栏目路径为 /jxsrmzf/zwgk/；指南、制度、法定主动公开、依申请公开、年度报告 5 个二级栏目全部集中挂载在该栏目下，路径前缀统一为 /jxsrmzf/。
  - 政策文件库（/jxsrmzf/szfwj/）与规章库（/jxsrmzf/gzk/）都是省政府主站子栏目；行政规范性文件库使用独立子域 xzgfxwjk.jiangxi.gov.cn（命名为"省级规章规范性文件发布平台"），当前收录 1235 件现行有效文件。
  - 政府公报、政府信息公开年报也在省政府主站 /jxsrmzf/ 路径下提供；省政府主站另一关联平台为江西政务服务网（jxzwfww.gov.cn），面向办事服务而非公开库，本次不入 source_registry。
  - 三个最关键 URL：主站 http://www.jiangxi.gov.cn/、政务公开首页 https://jiangxi.gov.cn/jxsrmzf/zwgk/pc/list.html、行政规范性文件库 https://xzgfxwjk.jiangxi.gov.cn/
