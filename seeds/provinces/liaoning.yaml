      特色发现：
      - 辽宁「法定主动公开内容」颗粒度极细（22 类）：在 §20 列举的 14 类之外新增「政府债务 / 权责清单 / 公共资源配置 / 防范化解重大风险 / 督查与审计 / 国资监管 / 安全生产 / 企业减负 / 政务服务事项目录」9 项辽宁特色
      - 与重庆 14 类相比，辽宁把"重大民生信息"以外垂域（教育、医疗、社保等）独立成单独类目（"重大民生信息"本身保留）
      - 含 7 个外链垂域门户（celma / ccgp-liaoning / fgw.ln / lnrsks / gzw.ln / yjgl.ln / lnzwfw），颗粒度比多数省粗放；外链挂载占类目总数 32%
      - HTML 源码使用 huilan-jquery-ui 模板，无 chnl/docnum 字段；侧栏用 navTwoLi 列表展示
