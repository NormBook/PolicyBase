notes: |
  - 辽宁省政府门户 (ln.gov.cn) 沿用统一的 /web/zwgkx/zfxxgk1/ 路径约定：政策法规/规章/规范性文件统一挂在 zc/ 子树下。
  - 政策文件库 (lnszcwjk) 为聚合入口（首页 tab 切分：政府文件 / 地方性法规 / 政府规章 / 行政规范性文件），专题库地址分别独立。
  - 行政规范性文件库按发文主体二级分类（省政府/省政府办公厅 + 省政府部门），所有条目均标注"效力状态"（有效/废止/失效）。
  - 依申请公开位于独立的 /web/ysqgk/ 域外路径，与其它栏目同级。
