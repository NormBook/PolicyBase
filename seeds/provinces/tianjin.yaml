    note: |
      法定主动公开内容（fdzdgknr）下设多个一级类目（2026-07-22 自动抓取）
      URL: https://www.tj.gov.cn/zwgk/zfxxgkzl/fdzdgknr/
      注意：根 URL 通过 meta-refresh 跳转到 ./jgxx/，用户访问需先经过一次 JS 跳转。

      一级类目（需进下级子页面确认子结构）：
      1. 机关简介（jgxx）       - https://www.tj.gov.cn/zwgk/zfxxgkzl/fdzdgknr/jgxx/
                               （根路径通过 meta-refresh 进一步跳转到 ldxx/，疑似目录壳页面）
      2. 履职依据               - 待级联抓取
      3. 规划信息               - 待级联抓取
      4. 统计信息               - 待级联抓取
      5. 行政许可               - 待级联抓取
      6. 行政处罚/强制          - 待级联抓取
      7. 预算/决算              - 待级联抓取
      8. 收费项目               - 待级联抓取
      9. 政府采购               - 待级联抓取
      10. 重大项目              - 待级联抓取
      11. 重大民生信息          - 待级联抓取
      12. 应急管理              - 待级联抓取
      13. 招考录用              - 待级联抓取
      14. 监督检查              - 待级联抓取

      特色发现：
      - 天津市主动公开页采用「目录壳页面」范式：一级 URL 仅为跳转入口（meta-refresh + JS location.replace），实际内容挂载在二级 /ldxx/、/jgxx/ 等子页
      - 与重庆 14 类 36 URL 相比目录结构扁平、未在 HTML 源码中提供 chnl/docnum 字段；颗粒度接近北京（4-5 类）
      - 抓取受限：因 meta-refresh 重定向到二级目录，在 curl 静态抓取时只能获得中间页（268 字节），建议用浏览器/JS 渲染或直接从 zfxxgkzl 子页 (gkzn/gkzd/gknb/ysqgk/) 反向推断
