notes: |
  - 天津市将"政策文件库"命名为"津政文库"(/zwgk/zcwjk/)，是同一入口聚合地方性法规、规章、行政规范性文件三类的总枢纽。
  - 规章库与行政规范性文件库通过 /zwgk/zfxxgkzl/zlzc/ 路径下两个独立栏目提供（zlgz 与 xzgfxwj），而非 zcwjk 的子页。
  - 政府信息公开年报支持 2017–2025 年子目录入口（侧栏列出），无独立分页 URL，沿用 gknb 入口即可获取全部年度。
  - 三大关键 URL：https://www.tj.gov.cn/zwgk/zcwjk/ (政策文件库)、https://www.tj.gov.cn/zwgk/zfxxgkzl/ (信息公开专栏)、https://www.tj.gov.cn/zwgk/szfgb/ (政府公报)
