notes: |
  陕西特色:2024-03 上线"省级政策文件统一公开查询平台",在同一入口整合了省地方性法规(212 件)、省政府规章(117 件)、行政规范性文件(1199 件)三大类,统一检索/筛选/排序。
  政策文件库(zcwjk)首页为 JS 动态渲染的目录导航壳,爬取入口使用其高级检索页 `zcwjk/adsearch.html`(HTTP 200)。
  最关键 3 个 URL:
    1) https://www.shaanxi.gov.cn/zfxxgk/  政府信息公开专栏首页
    2) https://www.shaanxi.gov.cn/zfxxgk/zcwjk/adsearch.html  省级政策文件统一查询(高级检索页)
    3) https://www.shaanxi.gov.cn/zfxxgk/fdzdgknr/zcwj/nszfgz/  省政府规章库
