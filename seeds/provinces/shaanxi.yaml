      统计：18 个一级 fdzdgknr 类目 + 14 个 zdly 子类 + 5 个 zcwj 子类 = 37 个可达 URL；无 chnl/docnum 元数据。

      特色发现：
      - 陕西「法定主动公开内容」采用「15 类一级 + 重点领域 14 子类」双层结构，总计 18 类一级 + 19 类二级 = 37 个 URL；颗粒度粗于重庆（重庆 14 类直接挂 URL，不嵌套 zdly/）
      - 把「应急管理」「社会保障」「乡村振兴」「稳岗就业」「食品安全」等民生信息全归到 zdly/ 重点领域，而把「行政许可」「处罚强制」「收费项目」「政府网站年度报表」作为独立一级类目（与重庆的 §20 一级类目范式相近）
      - 树形节点未挂载 chnl/docnum 元数据；改用 id="210"/"214"/... 内部编号
      - zcwj/ 政策文件下挂 5 子类（规章/规范性文件/其他文件/省政府文件/省政府办公厅文件），是陕西的「政策统一公开查询」入口；与 disclosure_regime 的「政策文件库 zcwjk/adsearch.html」呼应
