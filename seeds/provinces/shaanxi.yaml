      「重点领域」/zdly/ 下挂 14 子类（与重庆 14 大类「重大民生信息」分类近似）：
      - 乡村振兴            /zfxxgk/fdzdgknr/zdly/fp/
      - 义务教育            /zfxxgk/fdzdgknr/zdly/jy/
