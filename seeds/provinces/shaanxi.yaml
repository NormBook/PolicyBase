      - 食品安全            /zfxxgk/fdzdgknr/zdly/spyp/
      - 养老服务            /zfxxgk/fdzdgknr/zdly/ylfw/
      - 公共资源            /zfxxgk/fdzdgknr/zdly/ggzypz/
      - 应急管理            /zfxxgk/fdzdgknr/zdly/yjgl/
      - 社会保障            /zfxxgk/fdzdgknr/zdly/shbz/
      - 土地管理            /zfxxgk/fdzdgknr/zdly/tdzs/
      - 保障性住房          /zfxxgk/fdzdgknr/zdly/bzxzf/
      - 财政资金直达基层     /zfxxgk/fdzdgknr/zdly/zdjc/
