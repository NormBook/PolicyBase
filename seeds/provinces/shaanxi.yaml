      法定主动公开内容（zfxxgk/fdzdgknr）。根路径返回 200 + meta refresh 跳转至 ./jgjj/，但实际入口在 zfxxgk 总枢纽 https://www.shaanxi.gov.cn/zfxxgk/ 的 fdzdgknr 频道下，含 18 个一级类目（无 chnl/docnum 元数据，仅靠链接 id="210"/"214"/"215" 等区分）。

      HTML 树形结构（2026-07-22 自动抓取）：

      根节点 https://www.shaanxi.gov.cn/zfxxgk/fdzdgknr/ 下挂 18 个一级类目（id 为门户内部编号）：

      1.  机关简介            id="195"      /zfxxgk/fdzdgknr/jgjj/         （含子栏目 省政府领导 id="4735" /zfxxgk/fdzdgknr/szfld/）
      2.  政策文件            id="195"      /zfxxgk/fdzdgknr/zcwj/         （含子栏目 规章 /zcwj/nszfgz/、行政规范性文件 /zcwj/gfxwj/、其他文件 /zcwj/index_qt.html、省政府文件 /zcwj/nszfwj/、省政府办公厅文件 /zcwj/nszfbgtwj/）
      3.  规划信息            id="210"      /zfxxgk/fdzdgknr/ghxx/
