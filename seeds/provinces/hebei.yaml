notes: |
  - 河北省政府门户 (www.hebei.gov.cn) 未单设"政策文献库",把政策聚合页 49f13cc2-... 同时作为 policy_library 使用;它聚合 政府规章 + 行政规范性文件 + 省政府文件 + 省政府办公厅文件 4 类。
  - 政府信息公开/政务公开体系全部 in-house 在 hebei.gov.cn 域内,不存在独立域 info.hebei.gov.cn 库门户(仅早期信息检索跳板);所有 URL 用 https://www.hebei.gov.cn/columns/<UUID>/index.html 模式。
  - 最关键的 3 个 URL:
      1) https://www.hebei.gov.cn/                  省政府主站
      2) https://www.hebei.gov.cn/columns/7b96ca20-882f-436c-9d13-7c91d82ccd55/index.html  政府信息公开专栏(首页+指南)
      3) https://www.hebei.gov.cn/columns/49f13cc2-db03-4d0c-b4fe-2f3f659d3b6e/index.html  政策聚合(4 类政策文件)
  - 特殊性:依申请公开主体是 "河北省政务公开办公室",联系电话 0311-87806536,邮箱 xxgk@hebei.gov.cn。

