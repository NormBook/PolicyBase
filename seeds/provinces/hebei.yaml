    note: |
      法定主动公开内容（df18331a-…）下设 1+N 范式（2026-07-22 自动抓取）
      URL: https://www.hebei.gov.cn/columns/df18331a-bf24-4c06-bc5f-07e45eeda295/index.html

      一级类目（侧栏导航）：
      1. 机构职能（UUID 4200a8b2-…）    /columns/4200a8b2-0c3c-4f29-8dae-8da5c06ba846/index.html
      2. 权责清单（UUID df18331a-… 主页）- /columns/df18331a-bf24-4c06-bc5f-07e45eeda295/index.html
      3. 行政许可/服务事项（外链）      hbzwfw.gov.cn/hbzw/foursxcx/itemList/xz_index.do?webId=1
      4. 行政执法/强制（外链，省司法厅）  sft.hebei.gov.cn/zfgs/Index/index
      5. 行政许可处罚信用公示（外链）   xy.hebei.gov.cn/publicity/04
      6. 规划信息（UUID 2122f9d5-…）    /columns/2122f9d5-0de4-40d8-b780-9585cb401598/index.html
      7. 统计信息（UUID 24c63737-…）    /columns/24c63737-7797-4a32-bf85-c2da059ca91f/index.html
      8. 预算决算（UUID 53f1d9cd-…）    /columns/53f1d9cd-f671-4c01-bc77-d46a1a10c4cc/index.html
      9. 重点领域信息公开（slideToggle 展开组）
         - 教育：            jyt.hebei.gov.cn/col/1533807631441/index.html
         - 医疗卫生：        wsjkw.hebei.gov.cn/ylws/index.jhtml
         - 社保：UUID 517bce54-…   /columns/517bce54-f7a9-42a7-8f2a-a35c3ef3cfef/index.html
         - 就业：            rst.hebei.gov.cn/ggzp/
         - 生态环境（外链）：hbepb.hebei.gov.cn/hbhjt/zwgk/fdzdgknr/zdlyxxgk/
         - 医保：UUID 15d5f24f-…   /columns/15d5f24f-56c9-4cf0-b3a0-40728b8ea3fb/index.html
         - 药品安全：UUID e15ce210-… /columns/e15ce210-6040-4f69-b2e7-8ed9068db397/index.html
         - 市场监管（外链）：scjg.hebei.gov.cn/node/913
         - 住房和城乡建设（外链）：zfcxjst.hebei.gov.cn/hbzjt/ztzl/jj/zjmsgc/
         - 社会救助和社会福利：minzheng.hebei.gov.cn/government?path=ETFLXX

      特色发现：
      - 河北省「法定主动公开内容」采用 1+N 范式：UUID 主页 df18331a-… 自身承载 1 个一级类目（权责清单），其余 9 类通过 UUID 子页或外链垂域门户挂载
      - 与重庆 14 类相比略少（无「机关简介/收费项目/招考录用/应急管理」独立类目）；但「重点领域信息公开」slideToggle 折叠组收纳 10 个垂域公开，是河北特色
      - HTML 源码为 easysite CMS 模板（含 eportalCurrentColumnId 等字段），但侧栏导航未暴露 chnl/docnum；按 UUID + 名称两级方式索引
