    note: |
      法定主动公开内容（fdzdgknr）下设 21 个一级类目（2026-07-22 自动抓取）
      URL: https://www.shanxi.gov.cn/zfxxgk/zfxxgkzl/fdzdgknr/
      注意：根 URL 通过 meta-refresh + JS 跳转到 ./lzyj/，需先进入一级子页 lzyj 才能获得完整 21 类侧栏。

      1. 履职依据（lzyj）           - /zfxxgk/zfxxgkzl/fdzdgknr/lzyj/
                                   子项：中央有关文件 + 国务院文件（外链至 gov.cn）
      2. 机关简介（jgjj）           - /zfxxgk/zfxxgkzl/fdzdgknr/jgjj/
      3. 规划信息（ghxx）           - /zfxxgk/zfxxgkzl/fdzdgknr/ghxx/
      4. 统计信息（tjxx）           - /zfxxgk/zfxxgkzl/fdzdgknr/tjxx/
      5. 权力和责任清单（qlhzrqd）  - /zfxxgk/zfxxgkzl/fdzdgknr/qlhzrqd/
