notes: |
  - 内蒙古自治区政府门户网站（nmg.gov.cn）以 /zwgk/zfxxgk/zfxxgkml/ 作为政府信息公开总枢纽，下设 gk=1~4 四个 tab 分别承载指南/制度/法定主动公开/年报，依申请公开独立为 /zwgk/zfxxgk/ysqgk/。
  - 政策文件库（nmg_zcwjk）、规章库（zwgk/gzk）、现行有效规范性文件库（xxgfxwjkk）三大专题库均为独立入口；规章库额外聚合了 12 个盟市政府规章入口。
  - 政府公报（zwgk/zfgb）根路径会自动 302 至当前年份目录（2026n/index.html），可直接使用根 URL。
  - 三个最关键的 URL：https://www.nmg.gov.cn/zwgk/zfxxgk/zfxxgkml/ ；https://www.nmg.gov.cn/nmg_zcwjk/ ；https://www.nmg.gov.cn/xxgfxwjkk/
