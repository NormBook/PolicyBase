    status: ok
    note: |
      法定主动公开内容（zfxxgkml/?gk=3）下设 SPA 单页模式（2026-07-22 自动抓取）
      URL: https://www.nmg.gov.cn/zwgk/zfxxgk/zfxxgkml/?gk=3
      范式类型：**single_page_spa**（查询参数 SPA：gk=1 指南、gk=2 制度、gk=3 主动公开、gk=4 年报）

      HTML 源码特征：
      - 侧栏包含 gk-item / xxgkItemList 容器（含 firstList / secondList / threeList 三级 ul-li 列表）
      - 顶部为「中国政府网 / 各部委」横排外链（gov.cn + 各部委门户）
      - 类目字段由 JS 动态注入，未在静态 HTML 中提供 chnl/docnum；外链字段 data-idLink="oLink" 标记部门入口
      - 已知主动公开栏目锚点（待浏览器渲染后逐项 chnl 化）：
        - 履职依据（中央、国务院、自治区党委政府文件库）
        - 机关简介（自治区领导 + 工作机构）
        - 规划信息（国民经济五年规划、专项规划）
        - 统计信息（区统计局公报、年鉴）
        - 行政许可 / 行政处罚（双公示入口）
        - 财政预决算
        - 重大民生信息（教育、医疗、社保、就业、扶贫）
        - 应急管理
        - 招考录用
        - 政府公报

      特色发现：
      - 内蒙古「法定主动公开内容」采用 SPA 单页模式（zfxxgkml/?gk=N），与湖南（zfxxgk/?state=N）同属查询参数 SPA
      - 静态 HTML 抓不到 chnl/docnum，需浏览器渲染或 API 反查（建议从 asnmg/zwgk/zwgkMore 接口）
      - 因 SPA 特性，本表不做静态 chnl/docnum 统计；建议另由 SPA 抓取 Agent 接管（运行 Playwright 或 Puppeteer）
