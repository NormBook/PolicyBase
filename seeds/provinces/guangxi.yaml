# 政府公报
gazette:
  url: http://www.gxzf.gov.cn/zfgb/index.shtml
  path_keyword: /zfgb/
  verified_at: 2026-07-22
  status: ok
  note: |
    广西壮族自治区人民政府公报（zfgb/）。《政府公报》刊登的政府规章文本为标准
    文本、与正式文件具有同等效力，主要栏目：自治区人民政府令、自治区人民政府
    文件、自治区人民政府办公厅文件、人事任免等。提供"进入历史公报"入口
    /zfgb/history.shtml。

notes: |
  - 广西采用"政府信息公开官网 www.gxzf.gov.cn + 法规规章规范性文件专题库
    gxfgwjk.gxrd.gov.cn:8090"双站结构：前者是政府公报+省级政府/办公厅发文+
    政策+规章+规范性文件+5 子栏目的统一枢纽；后者由广西人大主办，是涵盖地方性
    法规 (560) + 自治条例及单行条例 (57) + 政府规章 (251) + 规范性文件 (8206)
    的综合法规规章规范性文件数据库。两库均对外开放，跨站互补。
  - 政策类资源三种并列专题：政策文献库 /zcwj_885018/、自治区政府规章库
    /zcwj_885018/gxgzk/zzqgzk/、现行有效行政规范性文件 /zcwj_885018/xzgfxwj/，
    均位于同一节点 zfxxgkzl_84988/zcwj_885018 下，链接结构清晰。
  - 政府信息公开体系下没有单独的"行政规范性文件库"二级目录，规范性文件与规章
    同列为政策文件库（zcwj）下的子专题，命名为"现行有效行政规范性文件
    (xzgfxwj)"。该省特色还包括"桂在问"知识库（/hdjl/guizaiwen/index.shtml）
    与"12345 接诉即办"互动入口。
  - 三个最关键 URL：
    1) http://www.gxzf.gov.cn/zwgk/zfxxgkzl_84988/zfxxgkzn/index.shtml
       （政府信息公开总枢纽）
    2) http://www.gxzf.gov.cn/zwgk/zfxxgkzl_84988/zcwj_885018/gxgzk/zzqgzk/
       （自治区政府规章库）
    3) http://www.gxzf.gov.cn/zfgb/index.shtml （省政府公报）

