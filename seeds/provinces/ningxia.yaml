  verified_at: 2026-07-22
  status: ok
  note: |
    宁夏回族自治区人民政府门户网站（nx.gov.cn）。由自治区人民政府办公厅主办、
    自治区政府信息中心承办。备案号 宁ICP备05000375号，网站标识码 6400000001，
    地址 宁夏银川市兴庆区解放西街361号 邮编 750001 (0951)6363505。
    主导航含 首页 / 政务公开（zwgk）/ 政务服务（zwfw.nx.gov.cn）/ 政民互动 /
    宁夏数据 / 政府公报 等栏目。

# 政府信息公开总枢纽
disclosure_homepage:
  url: https://www.nx.gov.cn/zwgk/zfxxgk/
  path_keyword: /zwgk/zfxxgk/
  verified_at: 2026-07-22
  status: ok
  note: |
    "政府信息公开"专栏总枢纽（zwgk/zfxxgk/）。承担 5 个子栏目 + 法定主动公开
    内容下设 16 类目 + 重点领域公开（zdlygk）+ 政府信息公开年报的对外导航。
    站内同时存在两条并行入口：(1) /zwgk/zfxxgk/（本字段）；(2) /zwgk/（政务公开
    总枢纽，与广西 zfxxgkzl 节点同源）。

# 子栏目
sub_sections:
  disclosure_guide:
    url: https://www.nx.gov.cn/zwgk/zfxxgk/zfxxgkzn/
    path_keyword: /zwgk/zfxxgk/zfxxgkzn/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府信息公开指南（zfxxgkzn）。由自治区人民政府办公厅印发，明确主动公开
      16 类目（规章、规范性文件、机构职能、规划计划、统计信息、行政许可/处罚、
      财政预决算、行政事业性收费、政府采购、重大建设项目、民生政策、应急管理、
      监督检查、公务员招考、政府工作报告、政策解读），并列出公报、微信、查阅点
      等公开渠道。最新的办公厅指南全文见
      /zwgk/zfxxgk/zfxxgkzn/202206/t20220613_3558164.html。

  disclosure_regime:
    url: https://www.nx.gov.cn/zwgk/zfxxgk/zfxxgkzd/
    path_keyword: /zwgk/zfxxgk/zfxxgkzd/
    verified_at: 2026-07-22
    status: ok
    note: |
      政府信息公开制度（zfxxgkzd）。汇集国务院、自治区政府、自治区政府办公厅
      制定的政府信息公开相关制度文件列表。同一节点下还有"依申请公开 > 制度规定"
      入口 /zwgk/zfxxgk/ysqgk/zd/，与制度规定栏目互补。

  disclosure_proactive_catalog:
    url: https://www.nx.gov.cn/zwgk/zfxxgk/fdzdgknr/
    path_keyword: /zwgk/zfxxgk/fdzdgknr/
    verified_at: 2026-07-22
    status: fetch_failed
    note: |
      法定主动公开内容（fdzdgknr）。覆盖 16 类主动公开事项目录。下设重点领域公开
      /zwgk/zfxxgk/fdzdgknr/zdlygk/、机构简介 /zwgk/zfxxgk/fdzdgknr/jgjj/、政府工作
      报告 /zwgk/zfxxgk/fdzdgknr/zfgzbg_40932/、统计信息 /zwgk/zfxxgk/fdzdgknr/tjxx_40901/
      等 2 级专题，是自治区政府信息主动公开的总入口。

      HTML 树形结构（2026-07-22 自动抓取）：
      抓取失败：滑块 CAPTCHA 拦截。所有 /zwgk/* 子路径及根路径 / 均返回 22857 字节的「请稍候…」
      挑战页（class="puzzle-vcode"、window._$ts 滑块验证 + ctct slider）。curl + Mozilla UA + 完整
      headers + Referer 均无法通过；HEAD 请求返回 405/412，但 GET 始终落到挑战页。

      已知子栏目（来自 YAML 已有 note + fdzdgknr 路径推断）：
      - 重点领域公开      /zwgk/zfxxgk/fdzdgknr/zdlygk/
      - 机构简介          /zwgk/zfxxgk/fdzdgknr/jgjj/
      - 政府工作报告      /zwgk/zfxxgk/fdzdgknr/zfgzbg_40932/
      - 统计信息          /zwgk/zfxxgk/fdzdgknr/tjxx_40901/
      - 统计公报          /zwgk/zfxxgk/fdzdgknr/tjxx_40901/tjgb_40903/

      16 类主动公开事项目录（来自指南页 note）：
      1. 规章
      2. 规范性文件
      3. 机构职能
      4. 规划计划
      5. 统计信息
      6. 行政许可/处罚
      7. 财政预决算
      8. 行政事业性收费
      9. 政府采购
      10. 重大建设项目
      11. 民生政策
      12. 应急管理
      13. 监督检查
      14. 公务员招考
      15. 政府工作报告
      16. 政策解读

      统计：16 类 + 5 个可达子栏目；chnl/docnum 元数据全部不可见（被 CAPTCHA 拦截）。

      特色发现：
      - 宁夏「法定主动公开内容」颗粒度与青海相近（16 类）；与重庆 14 类相比，多「政策解读」「政府工作报告」两个独立类目
      - 树形节点采用 `_NNNNN` 后缀做栏目识别号（如 `zfgzbg_40932`、`tjxx_40901`、`tjgb_40903`），与西藏 `_NNNN` 后缀同源
      - 抓取边界：CAPTCHA/slider challenge 应记录为 blocked/handoff；不得执行滑块识别或反检测浏览器自动化，可复用已核验 YAML 路径表作为人工整理证据
      - CAPTCHA 特征：所有 /zwgk/、/xxgk_ysqgk/、/zwgk/zfxxgk/ 子路径返回 22857 字节「请稍候…」挑战页；ctct slider + puzzle-vcode JS challenge

