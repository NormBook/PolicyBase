# 专题库
libraries:
  policy_library:
    url: https://www.nx.gov.cn/zwgk/
    path_keyword: /zwgk/
    verified_at: 2026-07-22
    status: ok
    note: |
      政策文献库 = 政务公开总枢纽 /zwgk/，下设 政策（zc/）/ 政策解读（zwxx_11337/zcjd/
      移动版 wap.html）/ 自治区政府文件（qzfwj/）三个子专题。聚合入口为
      https://www.nx.gov.cn/zwgk/zc/index_2.html，按发布时序展示自治区政府、办公厅、
      办公厅函、宁政规发、宁政办规发 等文号文件全文。

  regulation_library:
    url: https://www.nx.gov.cn/zwgk/zc/gzk/
    path_keyword: /zwgk/zc/gzk/
    verified_at: 2026-07-22
    status: ok
    note: |
      自治区政府规章库（zwgk/zc/gzk/）。《自治区政府规章库》收录全区现行有效规章，
      按发文机关分为自治区政府规章和各市政府规章两层，组织检索 + 文本/图片版下载，
      根据公布/废止/修改情况动态更新。父目录 /zwgk/zc/ 同时是政策文献入口。

  normative_library:
    url: https://www.nx.gov.cn/zwgk/gfxwj/
    path_keyword: /zwgk/gfxwj/
    verified_at: 2026-07-22
    status: ok
    note: |
      行政规范性文件库（zwgk/gfxwj/）。汇集自治区人民政府、自治区政府办公厅印发的
      现行有效规范性文件，与"宁政规发""宁政办规发"两个文号序列对齐；首页路径
      /zwgk/gfxwj/index.html、第 2 页 /zwgk/gfxwj/index_1.html。2023 年
      《现行有效行政规范性文件目录清单》见
      /zwgk/tzgg/202309/t20230904_4247923.html，并设部门子库链接。

  disclosure_library:
    url: https://www.nx.gov.cn/zwgk/zfxxgk/
    path_keyword: /zwgk/zfxxgk/
    verified_at: 2026-07-22
    status: ok
    note: |
      政务公开/政府信息公开专栏 = /zwgk/zfxxgk/。与 disclosure_homepage 同址，是政府
      信息公开的总枢纽，承载 5 子栏目（指南/制度/法定主动公开/年报/依申请）+ 重点领域
      公开（fdzdgknr/zdlygk）+ 机构简介 + 政府工作报告 + 统计信息 + 各设区市/各组成
      部门链接。另一并行入口 /xxgk_ysqgk/ 仅承担依申请公开。

