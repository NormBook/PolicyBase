# 政府公报
gazette:
  url: https://www.nx.gov.cn/zwgk/zfxxgk/fdzdgknr/zfgzbg_40932/
  path_keyword: /zwgk/zfxxgk/fdzdgknr/zfgzbg_40932/
  verified_at: 2026-07-22
  status: ok
  note: |
    《宁夏回族自治区人民政府公报》在线入口为 fdzdgknr/zfgzbg_40932/（政府工作报告
    专题）；另一承接页为 zzsl/zfgzbg/。半月刊、CN64-1062/D、2007-12 由《宁夏政报》
    更名而来，主办单位 自治区人民政府办公厅。公报文本与正式行政文件具有同等效力。
    自治区层面未发现独立的 /zfgb/ 目录节点，公报内容统一归口到 fdzdgknr 法定主动公开
    类的"政府工作报告"与 zfxxgk_xxxxx 主题页内。

notes: |
  - 宁夏采用"自治区政府主站 + 政务公开枢纽 (zwgk) + 政府信息公开 (zwgk/zfxxgk) +
    政府公报室"四级站点结构。zwgk/ 承接 5 个子栏目（zfxxgkzn、zfxxgkzd、fdzdgknr、
    zfxxgknb、ysqgk），未设单独的"政府信息公开专栏 zfxxgkzl_xxxxx"二级编号节点
    （与广西 gxzf.gov.cn 的 zfxxgkzl_84988 不同）。
  - 政策类资源三个并列专题：政策（zc）/ 自治区政府文件（qzfwj）/ 行政规范性文件
    (gfxwj)，三者位于 zwgk/ 节点下平行位置，而非嵌套在"政策文件库"统一父目录下；
    自治区政府规章库是 zc/ 下唯一带专题属性的子节点（zwgk/zc/gzk/）。
  - 政府公报以"政府工作报告专题"为承载路径（/zwgk/zfxxgk/fdzdgknr/zfgzbg_40932/
    与 /zzsl/zfgzbg/），没有广西 /zfgb/ 或贵州 /zwgk/zfgb/ 的独立顶层目录。公报同时
    在 CNKI 提供电子版订阅（NXZB2017 等 ISSN 1008-0783）。
  - 三个最关键 URL：
    1) https://www.nx.gov.cn/zwgk/zfxxgk/      （政府信息公开总枢纽）
    2) https://www.nx.gov.cn/zwgk/zc/gzk/      （自治区政府规章库）
    3) https://www.nx.gov.cn/zwgk/gfxwj/       （行政规范性文件库）

