notes: |
  - 湖南特色: 政府信息公开专栏用参数化 URL `zfxxgk/index.html?state=N` 承载
    公开指南(0)/公开制度(1)/公开年报(3)/依申请公开等标签,同一物理页切换;
    依申请公开另有独立 ysqgk 栏目(可按办理单位在线申请)。
  - 无独立"行政规范性文件库"专栏: 规范性文件散入"文件库(wjk)"内,
    normative_library 标 partial,指向文件库上级栏目。规章单列规章库。
  - 3 个最关键 URL:
    1. 政府信息公开专栏 https://www.hunan.gov.cn/hnszf/xxgk/zfxxgk/index.html
    2. 文件库(政策文件) https://www.hunan.gov.cn/hnszf/xxgk/wjk/szfwj/wjk_glrb.html
