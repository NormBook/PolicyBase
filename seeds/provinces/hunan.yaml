         - 省政府办公厅：/hnszf/xxgk/zfxxgknb/szbm_97944/202601/...
         - 省发改委：/fgw.hunan.gov.cn/fgw/xxgk_70899/zwxxgk11/zfxxgknb11/...
         - 注：618 个 URL 完整列表见 sources_consulted 字段

      4. 依申请公开（2 个）：
         - /hnszf/xxgk/ysqgk/ysqgk.html
         - /hnszf/xxgk/ysqgk/202401/.../湖南省政府信息公开申请表.docx

      5. 政策文件库（14 个，文件库 6 大类）：
         - /hnszf/xxgk/wjk/tzdzlm.html （文件库首页）
         - /hnszf/xxgk/wjk/szfwj/wjk_glrb.html （省政府文件）
         - /hnszf/xxgk/wjk/szfwj/202606/... （单篇示例）

      6. 规章库（46 个 — 含 docx/pdf 双格式）：
