      5. 行政处罚：         https://zwfw-new.hunan.gov.cn/hnzwfw/ywtbygzw/index.html
      6. 其他对外管理服务事项： https://zwfw-new.hunan.gov.cn/hnzwfw/ywtbygzw/index.html
      7. 预算/决算：        http://czt.hunan.gov.cn/ztzl/hnczysgk/
      8. 收费项目：         http://czt.hunan.gov.cn/czt/xxgk/sfjjmlqd/index.html
      9. 政府采购：         http://www.ccgp-hunan.gov.cn/
      10. 重大项目：        http://fgw.hunan.gov.cn/fgw/xxgk_70899/zdjsxm/index.html
      11. 重大民生信息：     javascript:void(0)（父节点，子菜单通过 hover 展开）
      12. 招考录用：        http://www.hxw.gov.cn//channel/20650.html
      13. 政府网站工作年度报表： javascript:void(0)
      14. 政府信息主动公开事项目录： javascript:void(0)
      15. 其他法定信息：    http://www.hunan.gov.cn/hnszf/xxgk/zdlyxxgk/zdlyxxgk.html

      范式特征：
      - 湖南采用 SPA 单页模式（?state=N）：同一物理页 index.html 通过 state 参数切换
        公开指南(0)/公开制度(1)/公开年报(3)/依申请公开等标签；curl 默认只能拿默认视图
      - 无 chnl/docnum 字段（与重庆 chnl=120519/docnum=418 模式不同），子节点用 id="nogknr_xxx"
      - 多个重大民生信息/政府网站工作年度报表/主动公开事项目录子项用 javascript:void(0)
        占位，必须经 hover/click 加载，无法在静态 HTML 中捕获完整三级 URL
      - 大量子栏目外链到 zwfw-new.hunan.gov.cn（政务服务网），与"主动公开"内容分离
      - 数据规模颗粒度比重庆细度低（多数为单页链接，无 docnum 计数）
