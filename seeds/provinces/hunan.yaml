      范式特征：湖南不在省级门户汇总 14 大类，而是分散在省政府门户 + 11 个省直委办局子站
      （fgw/czt/jtt/sft 等）+ 14 个市州子站。Playwright hover 触发 JS 异步加载后才暴露完整 URL 列表。

      采集边界：历史 Playwright 脚本仅作为不可复用的探索记录。不得隐藏 webdriver 标记、构造反检测请求头、
