gazette:
  url: https://www.xinjiang.gov.cn/xinjiang/zfgb/zfgb.shtml
  path_keyword: xinjiang/zfgb/
  verified_at: 2026-07-22
  status: ok
  note: |
    新疆维吾尔自治区人民政府公报总入口（半月刊）。
    已确认当期：2026 年第 11-12 期（2026-06-15 发布，来源：自治区人民政府办公厅）。
    每期含 10 个常设栏目：政府工作报告 / 自治区人民政府令 / 自治区人民政府文件 /
    自治区人民政府办公厅文件 / 干部任免 / 部门文件 / 法律法规 / 政府规章 /
    常务会议 / 其他。每期同步提供 PDF 下载（路径范式：
    /xinjiang/zfgbxx/{YYYYMM}/{hash}/files/{hash}.pdf）。
    历史归档另有 /xinjiang/zfgb/common_list_16.shtml（2002–2004 公报目录）。
    主办：新疆维吾尔自治区人民政府政务服务办公室；编辑部地址：乌鲁木齐市天山区中山路 479 号；
    邮编 830000；电话 0991-2383718。

notes: |
  - 新疆门户把"政务公开"与"政府信息公开"分两个入口呈现：
    /xinjiang/zwgk/zw.shtml（政务公开，侧重视觉化推荐位）
    /xinjiang/zfxxgk/jump.shtml（政府信息公开，侧重要素式目录）。
    前者聚合"政府公报 / 政策解读 / 政策 / 通知公告"等动态类目；
    后者聚合"指南 / 制度 / 法定主动公开 / 年报 / 依申请公开"等法定类目。
  - 政府规章库（/xinjiang/gzk/）与行政规范性文件库（/xinjiang/gfxwj1/）分别建库，
    互不交叉。规章库以"政府令"序号为索引；规范性文件库以"新政发 / 新政办发"为索引。
  - 三个最关键 URL：
    1) https://www.xinjiang.gov.cn/xinjiang/zfxxgk/jump.shtml  （信息公开总枢纽）
    2) https://www.xinjiang.gov.cn/xinjiang/zfl/zfxxgk_zhengce_list.shtml?cnName=政府令  （政策文献库）
    3) https://www.xinjiang.gov.cn/xinjiang/zfgb/zfgb.shtml  （政府公报）

