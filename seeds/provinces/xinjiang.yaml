# 信息公开总枢纽（政务公开 / 政府信息公开）
disclosure_homepage:
  url: https://www.xinjiang.gov.cn/xinjiang/zfxxgk/jump.shtml
  path_keyword: xinjiang/zfxxgk/
  verified_at: 2026-07-22
  status: ok
  note: |
    自治区政府门户网站"政府信息公开"专栏总枢纽。从该页可进入：
    指南 / 制度 / 法定主动公开 / 年报 / 依申请公开 / 各地各部门链接 等 6 个子栏目。

