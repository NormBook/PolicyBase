    note: |
      依申请公开总入口。提供申请表下载（DOC 格式，路径示例：
      /xinjiang/ysqgk/2023-03/27/7d5d12f123b54893ab57196e0806c1fe/files/fb0ce962be77491f8ee95948d2314691.doc）。
      自治区本级及各厅局（财政厅 / 民政厅 / 水利厅 / 应急厅 / 广电局 / 机关事务局 等）
      均各自维护依申请公开子栏目，URL 范式：{dept}.xinjiang.gov.cn/.../zfxxgk_ysqgk.shtml 或
      /.../zfxxgk_xxgkzn.shtml。

