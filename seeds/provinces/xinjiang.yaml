  disclosure_proactive_catalog:
    url: https://www.xinjiang.gov.cn/xinjiang/fdzdgknr/jumpkey.shtml
    path_keyword: xinjiang/fdzdgknr/
    verified_at: 2026-07-22
    status: ok
    note: |
      法定主动公开内容总入口（含政府领导 / 机构职能 / 政府文件 / 财政预决算 /
      统计信息 / 建议提案办理 / 应急管理 / 重大建设项目 / 行政许可 / 行政处罚 等子类目）。
      该页通过 javascript: 切换展开各子目录。

      HTML 树形结构（2026-07-22 自动抓取）：

      新疆采用「cXXXXX 栏目号」单页架构，每个类目挂载到门户 /xinjiang/cNNNNN/ 子路径，无 chnl/docnum 元数据。

      fdzdgknr 总入口跳转：根路径 https://www.xinjiang.gov.cn/xinjiang/fdzdgknr/jumpkey.shtml 通过 javascript: 切换展开各子目录，但 zwgk 总枢纽页 /xinjiang/zwgk/zw.shtml 已暴露以下 fdzdgknr 子栏目（class="wugk-link"）：

      1.  重点领域／重大民生    /xinjiang/c101363/zdlyzdxxgk.shtml          （HTTP 200）
      2.  政府信息公开          /xinjiang/c114806/zfxxgk_gknrz.shtml         （HTTP 200）
      3.  政府信息公开          /xinjiang/c114807/zfxxgk_gknrz.shtml         （HTTP 200）
      4.  跳转链接              /xinjiang/c112439/jump.shtml
      5.  跳转链接              /xinjiang/c112442/jump.shtml
      6.  跳转链接              /xinjiang/c112447/jump.shtml
      7.  联系我们               /xinjiang/lxwm/jumpxq.shtml

      「重点领域／重大民生」/c101363/zdlyzdxxgk.shtml 进一步下挂 18 个子类（多数外链到厅局子站）：
      - 助企纾困服务专栏          https://zwfw.xinjiang.gov.cn/tsfw/zqskfwzl/index.html
      - 优化营商环境              http://xjdrc.xinjiang.gov.cn/xjfgw/c108309/yhys.shtml
      - 减税降费                  https://czt.xinjiang.gov.cn/xjczt/c115007/zfxxgk_list.shtml
      - 食品监管                  http://scjgj.xinjiang.gov.cn/xjaic/c112985/zfxxgk_gknrz.shtml
      - 药品监管                  http://mpa.xinjiang.gov.cn/xjyjj/ypjgdt/list_tyz.shtml
      - 法律法规                  http://rst.xinjiang.gov.cn/xjrst/c112719/list.shtml
      - 工作动态                  http://rst.xinjiang.gov.cn/xjrst/c112720/list.shtml
      - 就业服务                  https://rst.xinjiang.gov.cn/xjrst/jycyx/list.shtml
      - 事业单位招聘              http://rst.xinjiang.gov.cn/xjrst/c112746/list.shtml
      - 养老服务                  http://mzt.xinjiang.gov.cn/xjmzt/c113051/zfxxgk_list.shtml
      - 老年人服务专区            https://zwfw.xinjiang.gov.cn/tsfw/lnrfwzq/index.html
      - 文化活动场所              http://wlt.xinjiang.gov.cn/wlt/whhdcs/gzfw_list.shtml
      - 旅游服务信息              http://wlt.xinjiang.gov.cn/wlt/c112780/newwenlvtin_index.shtml
      - 服务事项                  https://zwfw.xinjiang.gov.cn/jiopweb/...
      - 政策解读                  http://wjw.xinjiang.gov.cn/hfpc/zcjd/zfxxgk_gknrz.shtml
      - 重点领域信息公开          http://wjw.xinjiang.gov.cn/hfpc/zdxxgk/zfxxgk_gknrz.shtml
      - 行政权力清单和责任清单    http://wjw.xinjiang.gov.cn/hfpc/qzqd/zfxxgk_gknrz.shtml
      - 联系我们                  /xinjiang/lxwm/jumpxq.shtml

      门户主导航额外暴露 2 个 fdzdgknr 入口：
      - 自治区人大        //www.xjpcsc.gov.cn/
      - 自治区政协        //www.xjzx.gov.cn/

      统计：3 个 fdzdgknr 一级栏目（c101363/c114806/c114807）+ 18 个 zdly 子类 = 21 个 URL；无 chnl/docnum 元数据。

      特色发现：
      - 新疆「法定主动公开内容」是单页 SPA 架构（cXXXXX 栏目号 + javascript: 切换展开），与传统 fdzdgknr/ 树形不同
      - fdzdgknr 一级栏目被压缩到 3 个：c101363 重点领域/重大民生 + c114806 + c114807 各为「zfxxgk_gknrz.shtml」一般栏目
      - 大量子类挂到厅局子站（czt.xinjiang.gov.cn 减税降费、rst.xinjiang.gov.cn 就业服务、mzt.xinjiang.gov.cn 养老服务 等），呈现「省政府门户壳 + 厅局子站承载」模式
      - 抓取主入口：zwgk/zw.shtml 总枢纽 + c101363/zdlyzdxxgk.shtml 子栏目；fdzdgknr/jumpkey.shtml 根路径只做 javascript 切换跳转

